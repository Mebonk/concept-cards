<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Concepts">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Concept Cards</title>
<style>
:root{
  --bg:#f3f5f4;--surface:#fff;--ink:#14201c;--sub:#68736e;--line:#dfe5e2;--accent:#0f766e;--on-accent:#fff;--thumb:#e6ece9;--gold:#d99a00;--staroff:#c5cdc9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1210;--surface:#171e1b;--ink:#eef3f0;--sub:#92a099;--line:#26302c;--accent:#4fd1c0;--on-accent:#06201c;--thumb:#222c28;--gold:#f2b73d;--staroff:#35413c}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 10px;max-width:640px;margin:0 auto}
h1{font-size:30px;margin:0;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;line-height:1}
main{max-width:640px;margin:0 auto;padding:0 14px 40px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{flex:none;width:64px;height:64px;border-radius:12px;background:var(--thumb);object-fit:cover;display:grid;place-items:center;color:var(--sub);font-size:22px}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.link{display:block;color:var(--accent);font-size:14px;overflow-wrap:anywhere;text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:56px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=url],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick .thumb{width:72px;height:72px}
.pick button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:600}
.cancel{background:var(--bg);color:var(--ink)}
.save{background:var(--accent);color:var(--on-accent)}
.back,.more{height:44px;min-width:44px;border-radius:50%;border:0;background:transparent;color:var(--accent);font-size:20px}
.back{margin-left:-10px}
.hl{display:flex;align-items:center;gap:4px;min-width:0}
.hr{display:flex;align-items:center;gap:6px}
.hl h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.row{width:100%;border-top:0;border-left:0;border-right:0;background:var(--surface);color:var(--ink);text-align:left}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--thumb);display:grid;place-items:center;font-size:22px}
.grow{flex:1;min-width:0}
.count{color:var(--sub);font-size:15px}
.rowmore{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--sub);font-size:22px}
.newf{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--accent);font-weight:600}
.danger{background:transparent;color:#c0392b;flex:none!important;padding:13px 6px!important}
.opt{display:flex;justify-content:space-between;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:17px;text-align:left}
.opt:last-of-type{border-bottom:0}
.opt .ck{color:var(--accent)}
.crumb{color:var(--sub);font-size:14px;margin:0 4px 10px;overflow-wrap:anywhere}
.gap{height:14px}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row[data-kind],.row[data-kind] *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row[data-kind] img{-webkit-user-drag:none}
.ghost{opacity:.35}
.drag-clone{position:fixed;z-index:20;pointer-events:none;background:var(--surface)!important;border-radius:14px;border:0!important;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:.96}
.ins-before{box-shadow:inset 0 3px 0 var(--accent)}
.ins-after{box-shadow:inset 0 -3px 0 var(--accent)}
.drop-into{outline:2px solid var(--accent);outline-offset:-2px;background:var(--thumb)!important}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:16px 8px 0}
textarea{min-height:84px;resize:vertical}
.memo{color:var(--sub);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row[data-kind="card"]{cursor:pointer}
.err{color:#c0392b;font-size:14px;min-height:20px;margin-top:8px}

.bar{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.tabs{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.sort{flex:none;width:auto;padding:8px 10px;font-size:16px}
.chip{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:999px;background:var(--thumb);color:var(--sub);font-size:12px}
#cv{display:block;width:min(300px,100%);height:auto;aspect-ratio:1;margin:0 auto;border-radius:12px;background:var(--thumb);touch-action:none;cursor:grab}
[hidden]{display:none!important}
.cbox{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent);font-size:15px;font-weight:700}
.cbox.on{background:var(--accent);border-color:var(--accent)}
body.selecting main{padding-bottom:110px}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
#selbar .save{border:0;border-radius:12px;padding:12px 18px;font-weight:600}
#selbar .save:disabled{opacity:.4}
.radio{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-size:16px!important;margin:10px 0!important}
.radio input{width:20px;height:20px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}

.tools{display:flex;gap:10px;align-items:center;max-width:640px;margin:0 auto;padding:0 14px 10px}
.tools input{flex:1;min-width:0;padding:10px 12px}
.seg{flex:none;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--sub);width:40px;height:40px;font-size:18px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.list.compact .row{padding:7px 14px;gap:12px}
.list.compact .thumb{width:40px;height:40px;border-radius:8px;font-size:16px}
.list.compact .grow{display:flex;align-items:center;gap:8px}
.list.compact .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list.compact .chip{margin:0;flex:none}
.list.compact .link,.list.compact .memo{display:none}
.list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:transparent;overflow:visible;border-radius:0}
.list.grid .row{position:relative;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border:0;background:var(--surface);border-radius:14px;min-width:0}
.list.grid .thumb{width:100%;height:auto;aspect-ratio:1}
.list.grid .name{font-size:14px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list.grid .chip,.list.grid .link,.list.grid .memo{display:none}
.list.grid .rowmore{position:absolute;top:12px;right:12px;width:30px;height:30px;font-size:18px;background:rgba(0,0,0,.5);color:#fff}
.list.grid .cbox{position:absolute;top:12px;left:12px}
.list.grid .cbox:not(.on){background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.chips .chip{margin:0}
button.chip{border:0;font:inherit;font-size:12px;cursor:pointer}
.list.grid .chips{display:none}
.gpick{display:flex;flex-wrap:wrap;gap:8px}
.gtog{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.gtog.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.gadd{display:flex;gap:8px;margin-top:10px}.gadd input{flex:1;min-width:0}
.gadd button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.gempty{color:var(--sub);font-size:14px}
/* Day 9: star ratings. --f is how much of the star is filled (0%, 50%, 100%) */
.star{display:inline-block;line-height:1;background:linear-gradient(90deg,var(--gold) var(--f,0%),var(--staroff) var(--f,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stars{display:inline-flex;gap:1px;font-size:15px;margin-top:3px}
.list.compact .stars{margin:0;flex:none;font-size:13px}
.list.grid .stars{display:flex;justify-content:center;margin:0;font-size:14px}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpick{display:flex;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.rpick .star{font-size:34px;width:40px;height:44px;line-height:44px;text-align:center;cursor:pointer}
.rval{color:var(--sub);font-size:15px}
.rclear{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="hl">
    <button class="back" id="backBtn" aria-label="Back to folders" hidden>‹</button>
    <h1 id="title">Folders</h1>
  </div>
  <div class="hr">
    <button class="more" id="selBtn" style="font-size:16px;padding:0 12px;border-radius:22px" hidden>Select</button>
    <button class="more" id="moreBtn" aria-label="Rename or delete folder" hidden>⋯</button>
    <button class="add" id="addBtn" aria-label="Add card" hidden>+</button>
  </div>
</header>
<div class="tools" id="tools" hidden>
  <input type="text" id="q" placeholder="Search name, genre, memo, link" aria-label="Search cards" enterkeyhint="search">
  <div class="seg" id="seg" role="group" aria-label="View">
    <button data-v="list" aria-label="List view">☰</button>
    <button data-v="compact" aria-label="Compact view">≡</button>
    <button data-v="grid" aria-label="Grid view">▦</button>
  </div>
</div>
<main id="main"></main>

<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">New card</h2>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Apple" autocomplete="off">
    <label for="url">Weblink</label>
    <input type="url" id="url" placeholder="applelover.com" autocapitalize="none" autocorrect="off">
    <label>Genres (tap to add or remove)</label>
    <div class="gpick" id="gpick"></div>
    <div class="gadd"><input type="text" id="gnew" placeholder="New genre" autocomplete="off"><button type="button" id="gaddBtn">Add</button></div>
    <label>Rating</label>
    <div class="rate"><div class="rpick" id="rpick" role="group" aria-label="Rating"></div><span class="rval" id="rval"></span><button type="button" class="rclear" id="rclear" hidden>Clear</button></div>
    <div class="gempty" style="margin-top:2px">Tap the left half of a star for a half star. Tap the same spot again to clear.</div>
    <label for="memo">Memo</label>
    <textarea id="memo" placeholder="Anything you want to remember about this card"></textarea>
    <label>Image</label>
    <div class="pick">
      <div class="thumb" id="preview">🖼</div>
      <button type="button" id="pickBtn">Choose image</button>
      <button type="button" id="pasteBtn">Paste</button>
      <button type="button" id="cropBtn" hidden>Crop</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button class="danger" id="del" hidden>Delete</button>
      <button class="cancel" id="cancel">Cancel</button>
      <button class="save" id="save">Save card</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="fbg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <h2 id="fTitle">New folder</h2>
    <label for="fname">Name</label>
    <input type="text" id="fname" placeholder="Entertainment" autocomplete="off">
    <label for="fparent">Inside</label>
    <select id="fparent"></select>
    <div class="err" id="ferr"></div>
    <div class="actions">
      <button class="danger" id="fdel" hidden>Delete</button>
      <button class="cancel" id="fcancel">Cancel</button>
      <button class="save" id="fsave">Save folder</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="gbg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <h2 id="gTitle">Edit genre</h2>
    <label for="gname">Name</label>
    <input type="text" id="gname" autocomplete="off">
    <div class="err" id="gerr"></div>
    <div class="actions">
      <button class="danger" id="gdel">Delete</button>
      <button class="cancel" id="gcancel">Cancel</button>
      <button class="save" id="gsave">Save genre</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="mbg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Move to folder</h2>
    <div id="mopts"></div>
    <div class="actions"><button class="cancel" id="mcancel">Cancel</button></div>
  </div>
</div>

<div class="sheet-bg" id="cbg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <h2 id="cTitle">Crop image</h2>
    <canvas id="cv" width="600" height="600"></canvas>
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" style="width:100%">
    <div class="hint" style="margin:8px 0 0">Drag the image to reposition it.</div>
    <div class="actions">
      <button class="cancel" id="ccancel">Skip</button>
      <button class="save" id="cdone">Use crop</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="kbg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kTitle">
    <h2 id="kTitle">Copy to folder</h2>
    <label class="radio"><input type="radio" name="kmode" value="linked" checked> Linked: edits show in every copy</label>
    <label class="radio"><input type="radio" name="kmode" value="copy"> Independent: its own separate copy</label>
    <label>Choose destination</label>
    <div id="kopts"></div>
    <div class="actions"><button class="cancel" id="kcancel">Cancel</button></div>
  </div>
</div>
<div id="selbar" hidden><span id="selcount">0 selected</span><button class="save" id="selCopy" disabled>Copy to…</button></div>
<input type="file" id="rfile" accept="application/json,.json" multiple hidden>
<div id="toast" role="status"></div>

<script>
// Data model: an item is a card; a placement says where an item sits (parentId null = top level).
// Keeping them separate lets one item appear in several branches later (linked copies).
let db, pickedBlob = null, urls = [];
let view = null;        // null = folder list, 'all' = every card, otherwise a folder id
let sortMode = 'manual', genreFilter = null, lastView;
try { sortMode = localStorage.getItem('cc-sort') || 'manual'; } catch (e) {}
let viewMode = 'list', sq = '', qView, countKey = '', cardIO, migrating = false;   // Day 6: view mode, search text, batch rendering
const BATCH = 60;
let shownCount = BATCH;
try { viewMode = localStorage.getItem('cc-view') || 'list'; } catch (e) {}
const reorderOK = () => sortMode === 'manual' && !genreFilter && !sq && viewMode !== 'grid';   // manual drag-order only makes sense in the full, unsorted list
let editingFolder = null, movingPlacement = null, editing = null;   // editing = { p, it } while the card sheet edits an existing card
let selecting = false, selected = new Set(), selView;   // Day 5: multi-select (selected holds placement ids)
const parentOf = f => f.parentId || null;
const fOrder = f => f.order ?? f.createdAt;   // folders sort by manual order, else by creation time
let cache = { folders: [], top: [] };   // folders from before nesting have no parentId
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const req = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const all = s => req(db.transaction(s).objectStore(s).getAll());
const put = (s, v) => req(db.transaction(s, 'readwrite').objectStore(s).put(v));
const del = (s, k) => req(db.transaction(s, 'readwrite').objectStore(s).delete(k));

function openDB() {
  return new Promise((ok, no) => {
    const r = indexedDB.open('conceptcards', 3);
    r.onupgradeneeded = e => {
      const d = r.result;
      if (e.oldVersion < 1) {
        d.createObjectStore('items', { keyPath: 'id' });
        d.createObjectStore('placements', { keyPath: 'id' });
      }
      if (e.oldVersion < 2) d.createObjectStore('folders', { keyPath: 'id' });
      if (e.oldVersion < 3) d.createObjectStore('genres', { keyPath: 'id' });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}

function fixUrl(u) {
  u = u.trim();
  if (!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}

async function shrink(file, max = 800) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k);
    c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } catch (e) { return file; }
}

const folderOf = p => p.folderId || null;   // cards saved on Day 1 have no folderId: they are unfiled

function row(tag) { const r = document.createElement(tag); r.className = 'row'; return r; }

// ids of a folder and everything inside it
function subtree(folders, id) {
  const out = new Set([id]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const f of folders) if (!out.has(f.id) && out.has(parentOf(f))) { out.add(f.id); grew = true; }
  }
  return out;
}
// folders in display order with their depth, children under their parent
function flat(folders, parent = null, depth = 0) {
  const out = [];
  folders.filter(f => parentOf(f) === parent).sort((a, b) => fOrder(a) - fOrder(b))
    .forEach(f => { out.push({ f, depth }); out.push(...flat(folders, f.id, depth + 1)); });
  return out;
}
function entry(list, icon, name, count, go, folderId) {
  const r = row('button'); r.type = 'button';
  if (folderId) { r.dataset.kind = 'folder'; r.dataset.id = folderId; }
  const ic = document.createElement('div'); ic.className = 'ico'; ic.textContent = icon;
  const t = document.createElement('div'); t.className = 'grow name'; t.textContent = name;
  const c = document.createElement('div'); c.className = 'count'; c.textContent = count + ' ›';
  r.append(ic, t, c); r.onclick = go; list.append(r);
}

const viewKey = () => [view, genreFilter, sq, sortMode, viewMode].join('|');
let lastRenderKey = '';
async function render() {
  const keepY = window.scrollY;   // re-drawing the same screen after a save must not throw you back to the top
  await renderInner();
  const main = $('main');
  if (main.querySelector('[data-kind]')) {
    const h = document.createElement('div'); h.className = 'hint';

let delArmed = false, fArmed = false, pvBlob = null;
const blobToURL = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(b); });
function renderBackup(main) {

    : 'No backup yet. Safari can erase web app data, so save a backup file to Files or iCloud now and then.';

async function doBackup() {
  toast('Preparing backup…');
  const skipped = [];
  try {
    // Cards are written in parts of about 12 MB so an older iPhone never has to hold one huge file.
    const LIMIT = 12e6, parts = [];
    let cur = [], size = 0, total = 0;
    for (const it of await all('items')) {
      const { thumb, image, ...rest } = it;   // thumbnails are rebuilt on restore
      let rec = rest;
      if (image) {
        try {
          if (typeof image === 'string') rec = { ...rest, image };
          else if (!image.size) throw new Error('empty image');
          else { const u = await blobToURL(image); if (!u || u.length < 40) throw new Error('empty image'); rec = { ...rest, image: u }; }
        } catch (e) { skipped.push(it.name || it.id); }   // keep the card's text, skip only the broken picture
      }
      const sz = (rec.image ? rec.image.length : 0) + 600;
      if (cur.length && size + sz > LIMIT) { parts.push(cur); cur = []; size = 0; }
      cur.push(rec); size += sz; total++;
    }
    parts.push(cur);
    const stamp = new Date().toISOString().slice(0, 10);
    const rest = { placements: await all('placements'), folders: await all('folders'), genres: await all('genres') };
    const files = parts.map((items, i) => {
      const data = { app: 'conceptcards', v: 1, at: Date.now(), part: i + 1, of: parts.length, items, ...(i === 0 ? rest : {}) };
      const name = 'concept-cards-' + stamp + (parts.length > 1 ? '-part' + (i + 1) + 'of' + parts.length : '') + '.json';
      return new File([JSON.stringify(data)], name, { type: 'application/json' });
    });
    let done = false;
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files, title: files[0].name }); done = true; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (!done) {
      for (const file of files) {
        const a = document.createElement('a'), u = URL.createObjectURL(file); a.href = u; a.download = file.name;
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 10000);
        await new Promise(r => setTimeout(r, 400));
      }
    }
    try { localStorage.setItem('cc-backup', String(Date.now())); } catch (e) {}
    let msg = 'Backup ready: ' + total + ' card' + (total === 1 ? '' : 's') + (files.length > 1 ? ' in ' + files.length + ' files' : '');
    if (skipped.length) msg += '. Picture unreadable on ' + skipped.length + ': ' + skipped.slice(0, 3).join(', ') + (skipped.length > 3 ? '…' : '');
    toast(msg); render();
  } catch (e) { toast('Could not make the backup: ' + ((e && (e.name || e.message)) || 'unknown error')); }
}
$('rfile').onchange = async e => {
  const picked = [...e.target.files]; e.target.value = ''; if (!picked.length) return;
  let count = 0;
  try {
    toast('Restoring…');
    for (const file of picked) {   // a backup can be several part files; pick them all together
      const d = JSON.parse(await file.text());
      if (d.app !== 'conceptcards' || !Array.isArray(d.items)) { toast('That is not a Concept Cards backup.'); return; }
      for (const g of d.genres || []) await put('genres', g);
      for (const f of d.folders || []) await put('folders', f);
      for (const raw of d.items) {
        const it = typeof raw.image === 'string' ? { ...raw, image: await (await fetch(raw.image)).blob() } : raw;
        await put('items', it); count++;
      }
      for (const p of d.placements || []) await put('placements', p);
    }
    toast('Restored ' + count + ' card' + (count === 1 ? '' : 's')); render();
  } catch (x) { toast('Could not restore. Is this a Concept Cards backup?'); }
};

    await del('genres', id);
    view = null; closeGenreSheet(); render();
  } catch (e) { $('gerr').textContent = 'Could not delete the genre.'; }
};

// ---- search + view toggle (Day 6) ----

$('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { sq = $('q').value.trim().toLowerCase(); render(); }, 150); };

// ---- folders ----

// Day 11: a new card is autosaved as a draft while its sheet is open, and comes back after a reload.
let snap = '', lastDraftState = '', draftT = null, draftImg = null, draftImgVer = -1, imgVer = 0;
const formObj = () => ({ n: $('name').value, u: $('url').value, m: $('memo').value, g: [...sheetG].sort(), r: sheetRating, i: imgVer });
const formState = () => JSON.stringify(formObj());
const loadDraft = () => { try { return JSON.parse(localStorage.getItem('cc-draft') || 'null'); } catch (e) { return null; } };
const clearDraft = () => { try { localStorage.removeItem('cc-draft'); } catch (e) {} };
const writeDraft = o => { try { localStorage.setItem('cc-draft', JSON.stringify({ ...o, img: draftImg })); } catch (e) { if (draftImg) { draftImg = null; writeDraft(o); } } };
async function saveDraft() {
  if (editing || !$('bg').classList.contains('on')) return;
  const o = formObj(), cur = JSON.stringify(o);
  if (cur === lastDraftState) return;
  lastDraftState = cur;
  if (cur === snap) { clearDraft(); return; }
  writeDraft(o);   // text first, straight away
  if (imgVer !== draftImgVer) {   // the picture is added once it is encoded
    const v = imgVer, blob = pickedBlob; let u = null;
    if (blob) { try { u = await blobToURL(blob); } catch (e) {} }
    if (!$('bg').classList.contains('on') || editing) return;
    draftImg = u; draftImgVer = v; writeDraft(o);
  }
}
window.addEventListener('pagehide', saveDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });

function openSheet(p, it, auto) {
  editing = it ? { p, it } : null;
  $('sheetTitle').textContent = it ? 'Edit card' : 'New card';
  $('save').textContent = it ? 'Save changes' : 'Save card';
  $('del').hidden = !it; delArmed = false; $('del').textContent = 'Delete';
  $('name').value = it ? it.name : '';
  $('url').value = it ? it.url || '' : '';
  $('memo').value = it ? it.memo || '' : '';
  sheetG = new Set(it ? it.genres || [] : [genreFilter, view && view.startsWith('g:') ? view.slice(2) : null].filter(Boolean));
  sheetRating = it ? it.rating || 0 : 0; drawRating();
  $('gnew').value = '';
  all('genres').then(gs => { regG = gs; drawGpick(); });
  $('err').textContent = '';
  pickedBlob = null;
  setPreview(it && it.image ? it.image : null);
  $('bg').classList.add('on');
  snap = formState(); lastDraftState = snap; draftImg = null; draftImgVer = -1;
  clearInterval(draftT);
  if (!it) {
    const d = loadDraft();
    if (d) {
      $('name').value = d.n || ''; $('url').value = d.u || ''; $('memo').value = d.m || '';
      sheetG = new Set(d.g || []); sheetRating = d.r || 0; drawRating(); drawGpick();
      if (d.img) fetch(d.img).then(r => r.blob()).then(bl => { if ($('bg').classList.contains('on') && !editing && !pickedBlob) { pickedBlob = bl; setPreview(bl); } }).catch(() => {});
      toast('Draft restored');
    }
    lastDraftState = '';
    draftT = setInterval(saveDraft, 1000);
    if (!auto) $('name').focus();   // straight from the tap, so iOS raises the keyboard
  }
}
const closeSheet = () => { $('bg').classList.remove('on'); clearInterval(draftT); delArmed = false; $('del').textContent = 'Delete'; };

$('addBtn').onclick = () => openSheet();
$('cancel').onclick = () => { if (!editing) clearDraft(); closeSheet(); };   // Cancel throws the draft away on purpose
$('bg').onclick = e => {   // a stray tap outside the sheet no longer wipes what you typed

$('pickBtn').onclick = () => $('file').click();

async function takeImage(blob) { pickedBlob = await shrink(blob); setPreview(pickedBlob); $('err').textContent = ''; openCrop(pickedBlob); }
$('pasteBtn').onclick = async () => {   // paste an image copied from a web page or another app

// ---- multi-select + copy (Day 5) ----
// Linked copy = another placement of the SAME item (edit once, changes everywhere).
// Independent copy = a new item cloned from the original, with its own placement.
function updateSelCount() { $('selcount').textContent = selected.size + ' selected'; $('selCopy').disabled = !selected.size; }
function setSelecting(on) { selecting = on; selected.clear(); document.body.classList.toggle('selecting', on); render(); }
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
$('selBtn').onclick = () => setSelecting(!selecting);
$('selCopy').onclick = () => openCopySheet();
const closeCopySheet = () => $('kbg').classList.remove('on');
$('kcancel').onclick = closeCopySheet;
$('kbg').onclick = e => { if (e.target === $('kbg')) closeCopySheet(); };

async function openCopySheet() {
  const folders = await all('folders'), box = $('kopts'); box.textContent = '';
  const opt = (label, id, depth) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    const l = document.createElement('span'); l.textContent = label; l.style.paddingLeft = (depth * 18) + 'px';
    b.append(l); b.onclick = () => copySelected(id, document.querySelector('input[name=kmode]:checked').value === 'linked');
    box.append(b);

async function copySelected(dest, linked) {
  closeCopySheet();
  let made = 0, skipped = 0;
  try {
    const its = new Map((await all('items')).map(i => [i.id, i])), pls = await all('placements');
    for (const pid of selected) {
      const p = pls.find(x => x.id === pid), it = p && its.get(p.itemId);
      if (!it) continue;
      if (linked && pls.some(x => x.itemId === p.itemId && folderOf(x) === dest)) { skipped++; continue; }   // already there
      let itemId = p.itemId;
      if (!linked) { itemId = uid(); await put('items', { ...it, id: itemId, createdAt: Date.now() }); }
      await put('placements', { id: uid(), itemId, parentId: null, folderId: dest, order: Date.now() + made });
      made++;
    }
    toast((linked ? 'Linked ' : 'Copied ') + made + ' card' + (made === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' already there)' : ''));
  } catch (e) { toast('Could not copy. Storage may be full.'); }
  setSelecting(false);
}

// ---- image preview + crop ----
function setPreview(blob) {
  imgVer++;
  const pv = $('preview'); pv.textContent = '';
  if (blob) {
    pvBlob = blob; $('cropBtn').hidden = false;
    blobToURL(blob).then(u => { if (pvBlob === blob) pv.style.background = 'center/cover url("' + u + '")'; }).catch(() => {});
  } else { pvBlob = null; pv.style.background = ''; pv.textContent = '🖼'; $('cropBtn').hidden = true; }
}
let crop = null, cpan = null;
async function openCrop(blob) {
  if (!blob) return;
  try {
    const bmp = await createImageBitmap(blob);
    crop = { bmp, base: Math.max(300 / bmp.width, 300 / bmp.height), zoom: 1, ox: 0, oy: 0 };
    $('zoom').value = 1; drawCrop(); $('cbg').classList.add('on');
  } catch (e) {}
}
function drawCrop() {
  const { bmp, base, zoom } = crop, w = bmp.width * base * zoom, h = bmp.height * base * zoom;
  const mx = (w - 300) / 2, my = (h - 300) / 2;
  crop.ox = Math.max(-mx, Math.min(mx, crop.ox)); crop.oy = Math.max(-my, Math.min(my, crop.oy));
  const c = $('cv').getContext('2d'); c.clearRect(0, 0, 600, 600);
  c.drawImage(bmp, (150 + crop.ox - w / 2) * 2, (150 + crop.oy - h / 2) * 2, w * 2, h * 2);
}
const closeCrop = () => { $('cbg').classList.remove('on'); crop = null; cpan = null; };
$('cv').onpointerdown = e => { cpan = { x: e.clientX, y: e.clientY }; $('cv').setPointerCapture(e.pointerId); };
$('cv').onpointermove = e => {
  if (!cpan || !crop) return;
  const k = 300 / $('cv').clientWidth;
  crop.ox += (e.clientX - cpan.x) * k; crop.oy += (e.clientY - cpan.y) * k;
  cpan = { x: e.clientX, y: e.clientY }; drawCrop();
};
$('cv').onpointerup = $('cv').onpointercancel = () => { cpan = null; };
$('zoom').oninput = () => {
  if (!crop) return;
  const z = +$('zoom').value, r = z / crop.zoom;
  crop.ox *= r; crop.oy *= r; crop.zoom = z; drawCrop();
};
$('cropBtn').onclick = () => openCrop(pickedBlob || (editing && editing.it.image));
$('ccancel').onclick = closeCrop;
$('cdone').onclick = () => {
  $('cv').toBlob(b => { if (b) { pickedBlob = b; setPreview(b); } closeCrop(); }, 'image/jpeg', 0.85);
};

// ---- drag and drop ----
// Touch: press and hold, then drag. Mouse: just drag. Scrolling still works because a moving finger cancels the hold.
let drag = null, press = null, justDragged = false;
const HOLD_MS = 320;

document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
document.addEventListener('click', e => { if (justDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.row[data-kind]')) e.preventDefault(); });

$('main').addEventListener('pointerdown', e => {
  const r = e.target.closest('.row[data-kind]');
  if (!r || drag || e.button > 0 || selecting || e.target.closest('.rowmore')) return;
  press = { row: r, x: e.clientX, y: e.clientY, type: e.pointerType,
    timer: e.pointerType === 'mouse' ? null : setTimeout(() => startDrag(), HOLD_MS) };
});

function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }

document.addEventListener('pointermove', e => {
  if (press && !drag) {
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    if (press.type === 'mouse') { if (moved > 6) startDrag(e.clientX, e.clientY); }
    else if (moved > 10) cancelPress();
    return;
  }
  if (drag) { drag.x = e.clientX; drag.y = e.clientY; updateDrag(); }
});
document.addEventListener('pointerup', () => { cancelPress(); endDrag(false); });
document.addEventListener('pointercancel', () => { cancelPress(); endDrag(true); });

function startDrag(x, y) {
  if (!press) return;
  x = x ?? press.x; y = y ?? press.y;
  const row = press.row;
  clearTimeout(press.timer); press = null;
  const r = row.getBoundingClientRect();
  const clone = row.cloneNode(true);
  clone.classList.add('drag-clone');
  clone.style.width = r.width + 'px';
  document.body.append(clone);
  row.classList.add('ghost');
  drag = { kind: row.dataset.kind, id: row.dataset.id, row, clone, dx: x - r.left, dy: y - r.top, x, y, target: null, sy: window.scrollY };
  if (navigator.vibrate) navigator.vibrate(10);
  drag.timer = setInterval(autoScroll, 16);
  updateDrag();
}

function clearMarks() {
  document.querySelectorAll('.ins-before,.ins-after,.drop-into').forEach(n => n.classList.remove('ins-before', 'ins-after', 'drop-into'));
}

function updateDrag() {
  drag.clone.style.left = (drag.x - drag.dx) + 'px';
  drag.clone.style.top = (drag.y - drag.dy) + 'px';
  clearMarks();
  drag.target = null;
  const el = document.elementFromPoint(drag.x, drag.y);
  if (!el) return;
  const back = el.closest('#backBtn');
  if (back) {
    if (view && view !== 'all' && !view.startsWith('g:')) { back.classList.add('drop-into'); drag.target = { type: 'up' }; }
    return;
  }
  const row = el.closest('.row[data-kind]');
  if (!row || row === drag.row) return;
  const rect = row.getBoundingClientRect(), rel = (drag.y - rect.top) / rect.height;
  const mark = (type, cls) => { row.classList.add(cls); drag.target = { type, row, id: row.dataset.id }; };
  if (row.dataset.kind === 'folder') {
    if (drag.kind === 'folder' && rel < 0.25) mark('before', 'ins-before');
    else if (drag.kind === 'folder' && rel > 0.75) mark('after', 'ins-after');
    else mark('into', 'drop-into');
  } else if (drag.kind === 'card' && reorderOK()) {
    if (rel < 0.5) mark('before', 'ins-before'); else mark('after', 'ins-after');
  }
}

function autoScroll() {
  if (!drag) return;
  const edge = 70, h = window.innerHeight, before = window.scrollY;
  if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 4));
  else if (drag.y > h - edge) window.scrollBy(0, Math.ceil((drag.y - (h - edge)) / 4));
  if (window.scrollY !== before) updateDrag();
}

async function endDrag(cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  clearInterval(d.timer); d.clone.remove(); d.row.classList.remove('ghost'); clearMarks();
  justDragged = true; setTimeout(() => { justDragged = false; }, 80);
  if (!cancelled && d.target) { try { await applyDrop(d); } catch (e) {} }
  render();
}

async function applyDrop(d) {
  const { folders, top } = cache, t = d.target;
  const viewFolder = folders.find(f => f.id === view);
  const up = viewFolder ? parentOf(viewFolder) : null;
  const order = (selector, id) => {
    const ids = (selector.includes('card') ? cache.cardIds : [...document.querySelectorAll(selector)].map(r => r.dataset.id)).filter(x => x !== id);
    let i = ids.indexOf(t.id); if (t.type === 'after') i++;
    ids.splice(i, 0, id);
    return ids;
  };
  if (d.kind === 'card') {
    const p = top.find(x => x.id === d.id); if (!p) return;
    if (t.type === 'into') return put('placements', { ...p, folderId: t.id });
    if (t.type === 'up') return put('placements', { ...p, folderId: up });
    const ids = order('.row[data-kind="card"]', d.id), n = ids.length;   // higher order shows first
    for (let k = 0; k < n; k++) {
      const pl = top.find(x => x.id === ids[k]);
      if (pl && pl.order !== n - k) await put('placements', { ...pl, order: n - k });
    }
  } else {
    const f = folders.find(x => x.id === d.id); if (!f) return;
    if (t.type === 'into') return put('folders', { ...f, parentId: t.id, order: Date.now() });
    if (t.type === 'up') return put('folders', { ...f, parentId: up, order: Date.now() });
    const ids = order('.row[data-kind="folder"]', d.id);
    for (let k = 0; k < ids.length; k++) {
      const fo = folders.find(x => x.id === ids[k]);
      if (fo && fo.order !== k) await put('folders', { ...fo, order: k });
    }
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async () => {
  try {
    db = await openDB();
    try { await migrateGenres(); } catch (e) {}
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    restoreState();
    const wantView = view;
    try { await render(); } catch (e) {}
    if (restoreY && view === wantView) { const y = restoreY; requestAnimationFrame(() => window.scrollTo(0, y)); }
    restoreY = 0;
    if (loadDraft()) openSheet(null, null, true);   // the app was closed mid-draft: bring the draft back
  } catch (e) {
    $('main').innerHTML = '<div class="empty"><b>Storage unavailable</b>This browser blocked local storage. Try Safari or Chrome outside private mode.</div>';
  }
})();
